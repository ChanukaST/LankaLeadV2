services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lankalead
      POSTGRES_PASSWORD: lankalead
      POSTGRES_DB: lankalead
    ports: ["5432:5432"]
    volumes: [lankalead-postgres:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    working_dir: /service
    environment:
      DATABASE_URL: postgresql+asyncpg://lankalead:lankalead@postgres:5432/lankalead
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-development
    volumes: ["./backend:/service"]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: ./backend
    command: arq app.worker.WorkerSettings
    working_dir: /service
    environment:
      DATABASE_URL: postgresql+asyncpg://lankalead:lankalead@postgres:5432/lankalead
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-development
    volumes: ["./backend:/service"]
    depends_on: [postgres, redis]
volumes:
  lankalead-postgres:
